[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra --strict-markers --strict-config
markers =
    ui: testes de interface com streamlit.testing.v1.AppTest (mais lentos)
filterwarnings =
    # Ruído de bibliotecas de terceiros que não afeta o resultado dos testes.
    ignore:The `fitz` API is deprecated:FutureWarning
