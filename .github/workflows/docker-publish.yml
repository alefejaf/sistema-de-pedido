name: Publicar imagem Docker e Deploy TrueNAS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/alefejaf/sistema-de-pedido:latest
            ghcr.io/alefejaf/sistema-de-pedido:${{ github.sha }}

      - name: Instalar Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: 100.74.190.91

      - name: Configurar chave SSH
        shell: bash
        env:
          TRUENAS_SSH_KEY: ${{ secrets.TRUENAS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TRUENAS_SSH_KEY" > ~/.ssh/truenas_key
          chmod 600 ~/.ssh/truenas_key

      - name: Deploy no TrueNAS
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/truenas_key \
              truenas_admin@100.74.190.91 \
              "sudo -n /usr/bin/midclt call app.redeploy sistema-de-pedido"
